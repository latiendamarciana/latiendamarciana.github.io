---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.lang }}">
{% include head.html %}
  <body>
    {% include alert.html %}
    {% include nav-mobile.html %}
    {% include nav.html %}
    <div class="contact-container">
      <picture>
        <source 
          media="(min-width: 1025px)" 
          srcset="{{ page.image-lg }}">
        <source 
          media="(min-width: 641px)" 
          srcset="{{ page.image-sm }}">
        <img 
          src="{{ page.image-xs }}" 
          alt="{{ page.alt }}"
          loading="lazy">
      </picture>
      <div class="contact-content full-width">
        <header>     
          <h1 id="contact-form-heading">{{ page.content }}</h1>  
        </header>
        <main>
          <form method="post" action="https://formsubmit.co/latiendamarciana@pm.me" aria-labelledby="contact-form-heading">
            <input type="hidden" name="_next" value="https://latiendamarciana.com/mensaje-recibido/">
            <input type="hidden" name="_subject" value="¡Nuevo mensaje marciano!">
            <input type="hidden" name="_cc" value="tiendamarciana@proton.me">
            <label for="name">{{ page.contact-name }}</label>
            <input required type="text" name="name" id="name" autocomplete="on" oninvalid="this.setCustomValidity('{{ page.name-error-message }}')" oninput="this.setCustomValidity('')">
            <label for="phone">{{ page.phone }}</label>
            <input required type="tel" name="phone" id="phone" pattern=".{7,}" autocomplete="on" oninvalid="this.setCustomValidity('{{ page.phone-error-message }}')" oninput="this.setCustomValidity('')">
            <label for="email">{{ page.email }}</label>
            <input required type="email" name="email" id="email" pattern=".{4,64}" autocomplete="on" oninvalid="this.setCustomValidity('{{ page.email-error-message }}')" oninput="this.setCustomValidity('')">
            <label for="message">{{ page.message }}</label>
            <textarea required name="message" id="message" rows="4" pattern=".{4,}" oninvalid="this.setCustomValidity('{{ page.message-error-message }}')" oninput="this.setCustomValidity('')"></textarea>
            <div class="button-and-note">
              <button type="submit" aria-describedby="form-note">Enviar</button>
              <p class="note p-s" id="form-note">{{ page.form-note }}</p>
            </div>
          </form>            
        </main>
      </div>
    </div>

    {% include footer.html %}

    {% include modal-nav.html %}

    {% include modal-location.html %}

    {% include uikit-javascript.html %} 

  </body>
</html>
